<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment Review — OpSteward</title>
<style>
  :root {
    --bg: #211a15;
    --surface: #2c231d;
    --surface-raised: #362b23;
    --ink: #f3ece3;
    --ink-soft: #b7a996;
    --line: #4a3c30;
    --primary: #d97a3f;
    --primary-ink: #241a10;
    --good: #6fae6a;
    --bad: #c26b5e;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 18px 80px; }
  h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }
  .sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 28px; }

  /* ---- Gate ---- */
  #gate { display: flex; flex-direction: column; gap: 10px; max-width: 340px; margin-top: 60px; }
  #gate input {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 12px 14px;
    border-radius: var(--radius);
    font-size: 14px;
  }
  #gate button, .btn {
    border: none;
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #gate button { background: var(--primary); color: var(--primary-ink); }
  #gateError { color: var(--bad); font-size: 12px; min-height: 16px; }

  /* ---- List ---- */
  #app { display: none; }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .tab {
    flex: 1;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 10px 8px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab.active { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
  #status { color: var(--ink-soft); font-size: 13px; margin-bottom: 16px; }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 999px;
  }
  .badge.approved { background: rgba(111,174,106,0.18); color: var(--good); }
  .badge.rejected { background: rgba(194,107,94,0.18); color: var(--bad); }
  .badge.purpose { background: rgba(217,161,63,0.14); color: var(--accent, #d9a13f); margin-right: 6px; }
  .badge.method { background: var(--surface-raised); color: var(--ink-soft); }
  .purpose-row { margin-top: 8px; }
  .amount-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; }
  .amount-label { color: var(--ink-soft); font-size: 12px; }
  .amount-value { font-weight: 700; font-size: 15px; }
  .warning-row {
    margin-top: 10px;
    background: rgba(217,161,63,0.14);
    border: 1px solid rgba(217,161,63,0.4);
    color: #e0af52;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    display: flex;
    gap: 6px;
    align-items: flex-start;
  }
  #searchBox {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    margin-bottom: 14px;
    display: none;
  }
  #searchBox.visible { display: block; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .biz-name { font-weight: 700; font-size: 15px; }
  .submitted-at { color: var(--ink-soft); font-size: 11px; white-space: nowrap; }
  .biz-email { color: var(--ink-soft); font-size: 12px; margin-top: 2px; }
  .ref-row {
    margin-top: 12px;
    background: var(--surface-raised);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .ref-label { color: var(--ink-soft); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
  .ref-value { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .approve { background: var(--good); color: #12210f; flex: 1; }
  .reject { background: var(--bad); color: #2a0f0a; flex: 1; }
  .actions button:disabled { opacity: 0.5; cursor: default; }
  .result-msg { font-size: 12px; margin-top: 10px; }
  .result-msg.ok { color: var(--good); }
  .result-msg.warn { color: #d9a13f; }
  .result-msg.err { color: var(--bad); }

  .empty {
    text-align: center;
    color: var(--ink-soft);
    padding: 60px 20px;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Payment review</h1>
    <p class="sub">Manual payments waiting on you to check against GCash / bank / PayPal.</p>

    <div id="gate">
      <input id="secretInput" type="password" placeholder="Admin password" autocomplete="off" />
      <button id="gateBtn">Unlock</button>
      <div id="gateError"></div>
    </div>

    <div id="app">
      <div class="tabs">
        <div class="tab active" data-tab="pending">Pending</div>
        <div class="tab" data-tab="history">History</div>
      </div>
      <input id="searchBox" type="text" placeholder="Search by business name or email…" />
      <div id="status">Loading…</div>
      <div id="list"></div>
    </div>

    <div id="historyModalBackdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:50;">
      <div style="max-width:520px;margin:40px auto;max-height:80vh;overflow-y:auto;">
        <div class="card" style="margin:0 18px;">
          <div class="card-top">
            <div class="biz-name" id="historyModalTitle">Payment history</div>
            <button id="historyModalClose" class="btn" style="flex:none;background:var(--surface-raised);color:var(--ink);padding:6px 10px;">✕</button>
          </div>
          <div id="historyModalList" style="margin-top:12px;"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  const gate = document.getElementById("gate");
  const app = document.getElementById("app");
  const secretInput = document.getElementById("secretInput");
  const gateBtn = document.getElementById("gateBtn");
  const gateError = document.getElementById("gateError");
  const statusEl = document.getElementById("status");
  const listEl = document.getElementById("list");
  const searchBox = document.getElementById("searchBox");

  let secret = sessionStorage.getItem("opsteward_admin_secret") || "";
  let currentTab = "pending";
  let latestData = { pending: [], history: [] };

  // SECURITY FIX: the admin password used to be appended to the URL as
  // ?secret=... on every request (both here and in the fetch calls below).
  // That meant it could end up sitting in browser history and in server/
  // proxy access logs — anyone with access to either could read it later.
  // It's now sent as an X-Admin-Secret request header instead, which
  // browsers and standard server logs don't record. This helper builds
  // that header for every request in this file.
  function authHeaders(extra) {
    return Object.assign({ "X-Admin-Secret": secret }, extra || {});
  }

  function fmtDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
  }

  function renderPending(pending) {
    listEl.innerHTML = "";
    if (!pending.length) {
      listEl.innerHTML = '<div class="empty">Nothing waiting on you right now.</div>';
      return;
    }
    pending.forEach((biz) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-top">
          <div>
            <div class="biz-name">${biz.business_name || "(no business name set)"}</div>
            <div class="biz-email" data-email="${(biz.email || "").replace(/"/g, "&quot;")}" style="cursor:pointer;text-decoration:underline;">${biz.email || ""}</div>
          </div>
          <div class="submitted-at">${fmtDate(biz.manual_payment_submitted_at)}</div>
        </div>
        <div class="purpose-row">
          <span class="badge purpose">${biz.purpose || "New subscription"}</span>
          <span class="badge method">${biz.paymentMethod || "(not specified)"}</span>
        </div>
        <div class="ref-row">
          <div class="ref-label">Reference submitted</div>
          <div class="ref-value">${biz.payment_reference || "(empty)"}</div>
        </div>
        <div class="amount-row">
          <span class="amount-label">Expected amount</span>
          <span class="amount-value">${biz.expectedAmount || ""}</span>
        </div>
        <div class="amount-row">
          <span class="amount-label">Customer reported paying</span>
          <span class="amount-value" style="${biz.underpaidWarning ? "color:var(--bad);" : ""}">${biz.amountPaid || "(not specified)"}</span>
        </div>
        ${biz.underpaidWarning ? `<div class="warning-row">⚠️ ${biz.underpaidWarning}</div>` : ""}
        ${biz.duplicateWarning ? `<div class="warning-row">⚠️ ${biz.duplicateWarning}</div>` : ""}
        <div class="actions">
          <button class="btn approve" data-id="${biz.id}" data-action="approve">Approve</button>
          <button class="btn reject" data-id="${biz.id}" data-action="reject">Reject</button>
        </div>
        <div class="result-msg" id="result-${biz.id}"></div>
      `;
      listEl.appendChild(card);
    });
  }

  function renderHistory(history) {
    listEl.innerHTML = "";
    if (!history.length) {
      listEl.innerHTML = '<div class="empty">No decisions logged yet.</div>';
      return;
    }
    history.forEach((entry) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-top">
          <div>
            <div class="biz-name">${entry.business_name || "(no business name set)"}</div>
            <div class="biz-email" data-email="${(entry.email || "").replace(/"/g, "&quot;")}" style="cursor:pointer;text-decoration:underline;">${entry.email || ""}</div>
          </div>
          <span class="badge ${entry.action}">${entry.action}</span>
        </div>
        <div class="ref-row">
          <div class="ref-label">Reference · ${fmtDate(entry.reviewed_at)}</div>
          <div class="ref-value">${entry.reference || "(empty)"}</div>
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  function renderCurrentTab() {
    if (currentTab === "pending") {
      searchBox.classList.remove("visible");
      statusEl.textContent = latestData.pending.length
        ? `${latestData.pending.length} awaiting review`
        : "All caught up";
      renderPending(latestData.pending);
    } else {
      searchBox.classList.add("visible");
      const query = searchBox.value.trim().toLowerCase();
      const filtered = query
        ? latestData.history.filter((entry) =>
            (entry.business_name || "").toLowerCase().includes(query) ||
            (entry.email || "").toLowerCase().includes(query)
          )
        : latestData.history;
      statusEl.textContent = query
        ? `${filtered.length} matching "${searchBox.value.trim()}"`
        : latestData.history.length
        ? `Last ${latestData.history.length} decisions`
        : "No decisions logged yet";
      renderHistory(filtered);
    }
  }

  searchBox.addEventListener("input", renderCurrentTab);

  document.querySelectorAll(".tab").forEach((tabEl) => {
    tabEl.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
      tabEl.classList.add("active");
      currentTab = tabEl.dataset.tab;
      renderCurrentTab();
    });
  });

  async function loadPending() {
    statusEl.textContent = "Loading…";
    try {
      // SECURITY FIX: secret sent as a header, not ?secret=... in the URL.
      const res = await fetch(`/api/admin-manual-payments`, { headers: authHeaders() });
      if (res.status === 401) {
        // Secret got rejected (e.g. changed on the server) — send back to the gate.
        sessionStorage.removeItem("opsteward_admin_secret");
        app.style.display = "none";
        gate.style.display = "flex";
        gateError.textContent = "That password isn't valid anymore. Try again.";
        return;
      }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");
      latestData = { pending: data.pending || [], history: data.history || [] };
      renderCurrentTab();
    } catch (err) {
      statusEl.textContent = "Couldn't load payments: " + err.message;
    }
  }

  async function act(businessId, action, btnGroup) {
    const resultEl = document.getElementById(`result-${businessId}`);
    btnGroup.querySelectorAll("button").forEach((b) => (b.disabled = true));
    resultEl.className = "result-msg";
    resultEl.textContent = action === "approve" ? "Activating…" : "Rejecting…";

    try {
      // SECURITY FIX: secret sent as a header, not in the JSON body.
      const res = await fetch("/api/admin-manual-payments", {
        method: "POST",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ businessId, action }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");

      if (data.emailSent) {
        resultEl.className = "result-msg ok";
        resultEl.textContent = action === "approve"
          ? "Activated — customer emailed."
          : "Rejected — customer emailed.";
      } else {
        resultEl.className = "result-msg warn";
        resultEl.textContent = (action === "approve" ? "Activated" : "Rejected")
          + `, but the email failed to send (${data.emailError || "unknown error"}). You may want to let them know directly.`;
      }

      // Remove the card after a short pause so the outcome is readable first.
      setTimeout(() => loadPending(), 1400);
    } catch (err) {
      resultEl.className = "result-msg err";
      resultEl.textContent = "Failed: " + err.message;
      btnGroup.querySelectorAll("button").forEach((b) => (b.disabled = false));
    }
  }

  const historyModalBackdrop = document.getElementById("historyModalBackdrop");
  const historyModalTitle = document.getElementById("historyModalTitle");
  const historyModalList = document.getElementById("historyModalList");
  const historyModalClose = document.getElementById("historyModalClose");

  function openHistoryModal(email) {
    if (!email) return;
    historyModalTitle.textContent = `Payment history — ${email}`;
    const entries = latestData.history.filter((h) => (h.email || "").toLowerCase() === email.toLowerCase());
    if (!entries.length) {
      historyModalList.innerHTML = '<div class="empty">No past decisions for this account yet.</div>';
    } else {
      historyModalList.innerHTML = entries.map((entry) => `
        <div class="ref-row" style="margin-top:10px;">
          <div class="card-top" style="margin-bottom:6px;">
            <span class="badge ${entry.action}">${entry.action}</span>
            <span class="submitted-at">${fmtDate(entry.reviewed_at)}</span>
          </div>
          <div class="ref-label">Reference</div>
          <div class="ref-value" style="margin-bottom:6px;">${entry.reference || "(empty)"}</div>
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);">
            <span>${entry.purpose === "renewal" ? "Renewal" : "New subscription"} · ${entry.payment_method || "(method not specified)"}</span>
            <span>${entry.amount_paid != null ? "Paid: " + entry.amount_paid : ""}</span>
          </div>
        </div>
      `).join("");
    }
    historyModalBackdrop.style.display = "block";
  }

  historyModalClose.addEventListener("click", () => { historyModalBackdrop.style.display = "none"; });
  historyModalBackdrop.addEventListener("click", (e) => {
    if (e.target === historyModalBackdrop) historyModalBackdrop.style.display = "none";
  });
  listEl.addEventListener("click", (e) => {
    const emailEl = e.target.closest("[data-email]");
    if (emailEl) {
      openHistoryModal(emailEl.dataset.email);
      return;
    }
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    act(btn.dataset.id, btn.dataset.action, btn.parentElement);
  });

  async function unlock() {
    secret = secretInput.value.trim();
    if (!secret) return;
    gateError.textContent = "";
    gateBtn.disabled = true;
    gateBtn.textContent = "Checking…";
    try {
      // SECURITY FIX: secret sent as a header, not ?secret=... in the URL.
      const res = await fetch(`/api/admin-manual-payments`, { headers: authHeaders() });
      if (res.status === 401) {
        gateError.textContent = "Wrong password.";
        gateBtn.disabled = false;
        gateBtn.textContent = "Unlock";
        return;
      }
      sessionStorage.setItem("opsteward_admin_secret", secret);
      gate.style.display = "none";
      app.style.display = "block";
      loadPending();
    } catch (err) {
      gateError.textContent = "Couldn't reach the server: " + err.message;
      gateBtn.disabled = false;
      gateBtn.textContent = "Unlock";
    }
  }

  gateBtn.addEventListener("click", unlock);
  secretInput.addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });

  if (secret) {
    gate.style.display = "none";
    app.style.display = "block";
    loadPending();
  }
</script>
</body>
</html>
